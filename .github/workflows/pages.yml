name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Publish IndexNow ownership file
        env:
          INDEXNOW_KEY: ${{ secrets.COMPASS_INDEXNOW_KEY }}
        run: |
          set -euo pipefail
          set +x
          key="$(printf '%s' "${INDEXNOW_KEY:-}" | tr -d '\r\n')"
          if [ -z "$key" ]; then
            echo "IndexNow ownership key is not configured for this deployment; skipping."
            exit 0
          fi
          if ! [[ "$key" =~ ^[A-Za-z0-9-]{8,128}$ ]]; then
            echo "IndexNow ownership key must be 8-128 characters of A-Z, a-z, 0-9 or '-'." >&2
            exit 1
          fi
          printf '%s' "$key" > "docs/${key}.txt"
          chmod 644 "docs/${key}.txt"
          echo "Wrote the IndexNow ownership file into the published site."

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
