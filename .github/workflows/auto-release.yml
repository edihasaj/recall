name: Auto Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly create a production version tag (no native build)
        type: boolean
        default: false

permissions:
  actions: write
  contents: write

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/production' && inputs.publish == true
    name: Tag package version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect releasable version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version must be X.Y.Z for automatic releases; got $version"
            exit 1
          fi
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_package_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [ "$lock_version" != "$version" ] || [ "$lock_package_version" != "$version" ]; then
            echo "::error::package-lock.json versions must match package.json ($version)"
            exit 1
          fi

          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$tag already exists; no release needed."
            exit 0
          fi

          if ! grep -Eq "^## ${version}([[:space:]-]|$)" CHANGELOG.md; then
            echo "::error::CHANGELOG.md must include a '## $version' section before releasing."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          tag_sha="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$tag" \
              -f message="$tag" \
              -f object="$GITHUB_SHA" \
              -f type=commit \
              --jq '.sha'
          )"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$tag" \
            -f sha="$tag_sha"

      - name: Record explicit release follow-up
        if: steps.version.outputs.release == 'true'
        run: echo 'Tag prepared. Publication and native packaging require separate explicit production requests.' >> "$GITHUB_STEP_SUMMARY"
