name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # npm trusted publishing: the job exchanges a GitHub OIDC token for a
      # short-lived publish credential, so no long-lived NPM_TOKEN is needed.
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be vX.Y.Z; got $RELEASE_TAG"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish checksummed CLI package to GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = "${RELEASE_TAG#v}"
          archive="$(npm pack --ignore-scripts --silent)"
          node scripts/check-release-package.mjs "$archive"
          sha256sum "$archive" > "$archive.sha256"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" "$archive" "$archive.sha256" --clobber

      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.20.0

      - name: Publish
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$pkg_version" != "$tag_version" ]; then
            echo "::error::package.json version ($pkg_version) does not match tag ($tag_version)"
            exit 1
          fi
          if npm view "@edihasaj/recall@$pkg_version" version >/dev/null 2>&1; then
            echo "@edihasaj/recall@$pkg_version already published; skipping"
            exit 0
          fi
          npm publish

  macos-app:
    name: Build and publish macOS app
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Both taps stay in sync. `homebrew-tap` is the canonical multi-cask tap
      # used in install instructions (`brew install --cask edihasaj/tap/recall`).
      # `homebrew-recall` is the project-specific mirror so the shorter
      # `edihasaj/recall` form keeps working too.
      HOMEBREW_TAP_REPOS: "edihasaj/homebrew-tap edihasaj/homebrew-recall"
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate and select release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must be vX.Y.Z; got $RELEASE_TAG"
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install build and signing tools
        run: brew install xcodegen uv 1password-cli

      - name: Fetch pinned signing helper
        run: |
          git clone https://github.com/edihasaj/agent.git /tmp/recall-agent-codesign
          git -C /tmp/recall-agent-codesign checkout --detach 2b56a8ccc536e66d9aa353e04ebc289dac86af6c

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Recall.app
        run: npm run build:app

      - name: Verify app and bundled runtime versions
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/DerivedData.noindex/Build/Products/Release/Recall.app"
          expected="${RELEASE_TAG#v}"
          test -x "$app_path/Contents/Resources/Runtime/bin/recall-update-macos"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          runtime_version="$(node -p 'require(process.argv[1]).version' "$PWD/$app_path/Contents/Resources/Runtime/package.json")"
          if [ "$app_version" != "$expected" ] || [ "$runtime_version" != "$expected" ]; then
            echo "::error::release version mismatch: tag=$expected app=$app_version runtime=$runtime_version"
            exit 1
          fi

      - name: Set up Developer ID and notarization
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          test -n "$OP_SERVICE_ACCOUNT_TOKEN" || { echo "::error::OP_SERVICE_ACCOUNT_TOKEN is missing"; exit 1; }
          uv run --quiet /tmp/recall-agent-codesign/skills/apple-codesign/scripts/apple_codesign.py --vault applifyer setup

      - name: Sign, notarize, and verify Recall.app
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/DerivedData.noindex/Build/Products/Release/Recall.app"
          keychain="$HOME/Library/Keychains/apple-codesign.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/{print $2; exit}')"
          test -n "$identity" || { echo "::error::Developer ID identity is unavailable"; exit 1; }
          scripts/sign-macos-nested.sh "$app_path" "$identity"
          uv run --quiet /tmp/recall-agent-codesign/skills/apple-codesign/scripts/apple_codesign.py run "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Package app
        id: package
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/DerivedData.noindex/Build/Products/Release/Recall.app"
          out_dir="dist/release"
          mkdir -p "$out_dir"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$out_dir/Recall.app.zip"
          (cd "$out_dir" && shasum -a 256 Recall.app.zip > Recall.app.zip.sha256)
          sha="$(cut -d ' ' -f 1 "$out_dir/Recall.app.zip.sha256")"
          echo "zip=$out_dir/Recall.app.zip" >> "$GITHUB_OUTPUT"
          echo "sha_file=$out_dir/Recall.app.zip.sha256" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Create release if needed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "${{ steps.package.outputs.zip }}" \
            "${{ steps.package.outputs.sha_file }}" \
            --clobber

      - name: Publish Homebrew cask to all taps
        env:
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          RECALL_APP_ZIP_SHA256: ${{ steps.package.outputs.sha }}
          RECALL_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_GITHUB_TOKEN:-}" ]; then
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is missing; skipping Homebrew tap publish"
            exit 0
          fi

          node scripts/render-homebrew-cask.mjs > /tmp/recall.rb

          for tap_repo in $HOMEBREW_TAP_REPOS; do
            echo "::group::publish $tap_repo"
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $HOMEBREW_TAP_GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$tap_repo" || true)"
            if [ "$code" != "200" ]; then
              echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN cannot access $tap_repo (HTTP $code); skipping"
              echo "::endgroup::"
              continue
            fi

            workdir="$(mktemp -d)"
            tap_url="https://x-access-token:${HOMEBREW_TAP_GITHUB_TOKEN}@github.com/${tap_repo}.git"
            git clone "$tap_url" "$workdir/tap"
            mkdir -p "$workdir/tap/Casks"
            cp /tmp/recall.rb "$workdir/tap/Casks/recall.rb"
            git -C "$workdir/tap" config user.name "github-actions[bot]"
            git -C "$workdir/tap" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$workdir/tap" add Casks/recall.rb
            if git -C "$workdir/tap" diff --cached --quiet; then
              echo "$tap_repo: cask already current"
            else
              git -C "$workdir/tap" commit -m "Update recall ${RELEASE_TAG}"
              git -C "$workdir/tap" push
              echo "$tap_repo: pushed"
            fi
            echo "::endgroup::"
          done
