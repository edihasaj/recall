name: CI

on:
  push:
    branches: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check docs site
        run: npm run docs:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build CLI
        run: npm run build

      - name: Linux CLI smoke
        run: |
          node dist/cli.js --version
          node dist/cli.js doctor || true

  windows-vectors:
    name: Windows vectors (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    env:
      npm_config_better_sqlite3_binary_host_mirror: https://github.com/edihasaj/recall-prebuilds/releases/download
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - name: Verify installer checksum and failure handling
        run: ./test/windows-installer.test.ps1
      - name: Verify native vector queries and lexical fallback
        run: npx vitest run test/native-extension.test.ts test/sqlite-vec-phase2.test.ts test/history-phase6.test.ts test/vector-unavailable.test.ts
      - name: Generate, persist, and search real embeddings
        env:
          RECALL_TEST_REAL_EMBEDDINGS: "true"
        run: npx vitest run test/native-embedding-e2e.test.ts

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
