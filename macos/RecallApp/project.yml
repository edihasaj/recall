name: RecallApp
options:
  minimumXcodeGenVersion: 2.38.0
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.edihasaj.recall
    MACOSX_DEPLOYMENT_TARGET: 15.0
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    # Keep Debug and Release apps out of Spotlight. An unsigned Debug copy in
    # Xcode's default DerivedData can shadow the notarized /Applications app.
    SYMROOT: $(PROJECT_DIR)/../../build/DerivedData.noindex/Build/Products
    INFOPLIST_KEY_CFBundleDisplayName: Recall
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_LSUIElement: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Recall:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Recall
    resources:
      - path: Generated/Runtime
        type: folder
    settings:
      base:
        PRODUCT_NAME: Recall
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © Edi Hasaj
        CODE_SIGN_STYLE: Automatic
schemes:
  Recall:
    build:
      targets:
        Recall: all
